# Flotation ML Configuration

# XGBoost Hyperparameters
xgboost:
  n_estimators: 500
  max_depth: 5
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  min_child_weight: 5
  reg_alpha: 0.1
  reg_lambda: 1.0

# Ridge Regression Hyperparameters
ridge:
  alpha: 1.0

# LSTM Hyperparameters
lstm:
  hidden_size: 128
  num_layers: 2
  dropout: 0.3
  learning_rate: 0.001
  batch_size: 64
  epochs: 150
  patience: 20
